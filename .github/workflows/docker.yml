name: Playwright Tests with Predefined Docker Container

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install dependencies and run tests
      - name: Install dependencies and run Playwright tests
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT_ID: ${{ secrets.QASE_PROJECT_ID }}
          SALES_PORTAL_URL: ${{ secrets.SALES_PORTAL_URL }}
        run: |
          npm install
          npx playwright install
          npm run test:ui-regression

      # Step 3: Upload Playwright report
      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
