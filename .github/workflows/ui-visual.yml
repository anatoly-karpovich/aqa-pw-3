name: Run Playwright Visual Regression tests
on:
  workflow_dispatch: # Manually trigger the workflow
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install browsers
      - name: Install Playwright Browsers
        run: npx playwright install

      # Run Playwright UI tests
      - name: Run Playwright UI tests
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT_ID: ${{ secrets.QASE_PROJECT_ID }}
          SALES_PORTAL_URL: ${{ secrets.SALES_PORTAL_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_BOT_ID: ${{ secrets.TELEGRAM_CHAT_BOT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run test:visual
        continue-on-error: true

      # Create Allure report
      # - name: Create Allure report
      #   run: npm run allure-report

      # Save allure report into artifacts
      # - name: Save Allure report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ui-smoke-report
      #     path: ./allure-report

      # Save Playwright report into artifacts
      - name: Save Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report
